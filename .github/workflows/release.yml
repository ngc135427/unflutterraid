name: Release

# Manual release packaging (unsigned Android split APKs + web zip).
# Signing secrets are intentionally not required for this MVP workflow.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number (integer)'
        required: true
        default: '1'

jobs:
  package:
    name: Package Android + Web
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter gen-l10n
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Android APKs (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "${{ inputs.build_name }}" \
            --build-number "${{ inputs.build_number }}"

      - name: Build universal Android APK
        run: |
          flutter build apk --release \
            --build-name "${{ inputs.build_name }}" \
            --build-number "${{ inputs.build_number }}"

      - name: Build Web
        run: flutter build web --release

      - name: Stage dist artifacts
        run: |
          mkdir -p dist
          VERSION="${{ inputs.build_name }}"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/unflutterraid-android-armeabi-v7a-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/unflutterraid-android-arm64-v8a-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/unflutterraid-android-x86_64-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/unflutterraid-android-universal-v${VERSION}.apk"
          (cd build/web && zip -r "../../dist/unflutterraid-web-v${VERSION}.zip" .)
          (
            cd dist
            sha256sum * > SHA256SUMS.txt
          )
          ls -la dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unflutterraid-release-v${{ inputs.build_name }}
          path: dist/*
