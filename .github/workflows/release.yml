name: Release

# Manual release packaging (Android split/universal APK + web zip).
# Optional signing: set repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without secrets, release builds fall back to debug signing.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number (integer)'
        required: true
        default: '1'

jobs:
  package:
    name: Package Android + Web
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter gen-l10n
          flutter analyze --no-fatal-infos
          flutter test

      - name: Decode Android keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Release signing secrets detected."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; APKs will use debug signing."
          fi

      - name: Build Android APKs (split per ABI)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "${{ inputs.build_name }}" \
            --build-number "${{ inputs.build_number }}"

      - name: Build universal Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "${{ inputs.build_name }}" \
            --build-number "${{ inputs.build_number }}"

      - name: Build Web
        run: flutter build web --release

      - name: Stage dist artifacts
        run: |
          mkdir -p dist
          VERSION="${{ inputs.build_name }}"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/unflutterraid-android-armeabi-v7a-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/unflutterraid-android-arm64-v8a-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/unflutterraid-android-x86_64-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/unflutterraid-android-universal-v${VERSION}.apk"
          (cd build/web && zip -r "../../dist/unflutterraid-web-v${VERSION}.zip" .)
          (
            cd dist
            sha256sum * > SHA256SUMS.txt
          )
          ls -la dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unflutterraid-release-v${{ inputs.build_name }}
          path: dist/*
