<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unraid 设置页面原型</title>
    <style>
        :root {
            --primary: #6e8efb;
            --secondary: #a777e3;
            --accent: #ff8a00;
            --success: #2fbd72;
            --ink: #263244;
            --text: #596579;
            --muted: #8a94a6;
            --line: #e5e9f2;
            --soft-line: #eef1f7;
            --surface: #ffffff;
            --soft: #f7f9fc;
            --shadow: 0 18px 40px rgba(37, 48, 68, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 15% 10%, rgba(255, 138, 0, 0.10), transparent 26%),
                linear-gradient(135deg, #eef3fb 0%, #f8fbff 48%, #f4f1fb 100%);
            color: var(--ink);
        }

        button {
            border: none;
            cursor: pointer;
            font: inherit;
        }

        .stage {
            width: 100%;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .phone {
            width: 375px;
            height: 667px;
            position: relative;
            overflow: hidden;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: var(--shadow);
        }

        .phone::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(160deg, rgba(255, 255, 255, 0.18), transparent 42%),
                radial-gradient(circle at 85% 8%, rgba(255, 138, 0, 0.22), transparent 24%);
            pointer-events: none;
        }

        .phone-header {
            position: relative;
            z-index: 2;
            height: 104px;
            padding: 24px 20px 14px;
            display: grid;
            grid-template-columns: 38px 1fr 38px;
            align-items: start;
            gap: 10px;
            color: white;
        }

        .header-copy {
            text-align: center;
            min-width: 0;
        }

        .header-copy h1 {
            font-size: 22px;
            line-height: 1.2;
            font-weight: 700;
        }

        .header-copy p {
            margin-top: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.82);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .icon-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: white;
            background: rgba(255, 255, 255, 0.16);
            text-decoration: none;
            transition: transform 180ms ease, background 180ms ease;
        }

        .icon-button:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.24);
        }

        .phone-content {
            position: absolute;
            z-index: 2;
            top: 104px;
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden;
            border-radius: 25px 25px 0 0;
            background: var(--surface);
        }

        .scroll-view {
            height: 100%;
            overflow-y: auto;
            padding: 22px 20px 28px;
            scrollbar-width: thin;
        }

        .settings-intro {
            margin-bottom: 18px;
        }

        .settings-intro .eyebrow {
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .settings-intro h2 {
            margin-top: 5px;
            color: var(--ink);
            font-size: 20px;
            line-height: 1.25;
        }

        .settings-intro p {
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .section {
            margin-bottom: 18px;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 9px;
        }

        .section-title h2 {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
        }

        .section-title span {
            color: var(--muted);
            font-size: 12px;
        }

        .settings-card {
            border: 1px solid var(--soft-line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 5px 14px rgba(73, 89, 122, 0.05);
            overflow: hidden;
        }

        .setting-row {
            width: 100%;
            min-height: 62px;
            padding: 12px;
            display: grid;
            grid-template-columns: 30px 1fr auto;
            align-items: center;
            gap: 10px;
            background: white;
            color: var(--text);
            text-align: left;
            border-bottom: 1px solid var(--soft-line);
        }

        .setting-row:last-child {
            border-bottom: 0;
        }

        .setting-row strong {
            display: block;
            color: var(--ink);
            font-size: 14px;
            line-height: 1.25;
        }

        .setting-row small {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.35;
        }

        .setting-value {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .mini-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: var(--primary);
            background: rgba(110, 142, 251, 0.12);
        }

        .mini-icon.green {
            color: #188d50;
            background: #eaf8f0;
        }

        .mini-icon.orange {
            color: #9a6200;
            background: #fff6e5;
        }

        .language-panel {
            display: none;
            padding: 0 12px 12px 52px;
            border-bottom: 1px solid var(--soft-line);
            background: white;
        }

        .language-panel.active {
            display: block;
        }

        .segmented {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--soft-line);
            background: var(--soft);
        }

        .language-option {
            min-height: 32px;
            border-radius: 6px;
            color: var(--text);
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .language-option.active {
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 5px 10px rgba(110, 142, 251, 0.18);
        }

        .toast {
            position: absolute;
            z-index: 30;
            left: 22px;
            right: 22px;
            bottom: 24px;
            display: none;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            background: rgba(38, 50, 68, 0.94);
            font-size: 13px;
            text-align: center;
        }

        .toast.active {
            display: flex;
            animation: fadeIn 180ms ease-out both;
        }

        @font-face {
            font-family: "Material Icons";
            font-style: normal;
            font-weight: 400;
            src: url(https://fonts.gstatic.com/s/materialicons/v139/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2) format("woff2");
        }

        .material-icons {
            font-family: "Material Icons";
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 760px) {
            .stage {
                padding: 0;
            }

            .phone {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }

            .phone-content {
                border-radius: 24px 24px 0 0;
            }
        }
    </style>
</head>
<body>
    <main class="stage">
        <section class="phone" aria-label="Unraid 设置页面原型">
            <header class="phone-header">
                <a class="icon-button" id="backLink" href="server_info.html" aria-label="返回">
                    <span class="material-icons">arrow_back</span>
                </a>
                <div class="header-copy">
                    <h1>设置</h1>
                    <p>应用偏好</p>
                </div>
                <span class="icon-button" aria-hidden="true">
                    <span class="material-icons">settings</span>
                </span>
            </header>

            <div class="phone-content">
                <div class="scroll-view">
                    <div class="settings-intro">
                        <div class="eyebrow">App Settings</div>
                        <h2>简洁的应用设置</h2>
                        <p>语言只是一个小设置项，后续可继续加入主题、通知、显示密度等偏好。</p>
                    </div>

                    <section class="section">
                        <div class="section-title">
                            <h2>通用</h2>
                            <span>基础偏好</span>
                        </div>
                        <div class="settings-card">
                            <button class="setting-row" id="languageRow" type="button">
                                <span class="mini-icon"><span class="material-icons">translate</span></span>
                                <span>
                                    <strong>语言</strong>
                                    <small>界面文案显示语言</small>
                                </span>
                                <span class="setting-value"><span id="languageValue">跟随系统</span><span class="material-icons" style="font-size:18px;">expand_more</span></span>
                            </button>
                            <div class="language-panel" id="languagePanel">
                                <div class="segmented" id="languageChoices">
                                    <button class="language-option active" data-language="跟随系统">系统</button>
                                    <button class="language-option" data-language="简体中文">中文</button>
                                    <button class="language-option" data-language="English">English</button>
                                </div>
                            </div>
                            <button class="setting-row" type="button" data-toast="主题设置将后续添加">
                                <span class="mini-icon orange"><span class="material-icons">palette</span></span>
                                <span>
                                    <strong>主题</strong>
                                    <small>浅色、深色或跟随系统</small>
                                </span>
                                <span class="setting-value">即将支持<span class="material-icons" style="font-size:18px;">chevron_right</span></span>
                            </button>
                            <button class="setting-row" type="button" data-toast="通知偏好将后续添加">
                                <span class="mini-icon green"><span class="material-icons">notifications</span></span>
                                <span>
                                    <strong>通知</strong>
                                    <small>告警提醒与运行状态推送</small>
                                </span>
                                <span class="setting-value">即将支持<span class="material-icons" style="font-size:18px;">chevron_right</span></span>
                            </button>
                        </div>
                    </section>

                    <section class="section">
                        <div class="section-title">
                            <h2>连接</h2>
                            <span>登录相关</span>
                        </div>
                        <div class="settings-card">
                            <button class="setting-row" type="button" data-toast="服务器配置将在后续版本集中管理">
                                <span class="mini-icon"><span class="material-icons">dns</span></span>
                                <span>
                                    <strong>服务器配置</strong>
                                    <small>默认连接、协议与凭据管理</small>
                                </span>
                                <span class="setting-value">规划中<span class="material-icons" style="font-size:18px;">chevron_right</span></span>
                            </button>
                            <button class="setting-row" type="button" data-toast="File Browser 地址：http://tower.local:8080">
                                <span class="mini-icon green"><span class="material-icons">cloud</span></span>
                                <span>
                                    <strong>File Browser 配置</strong>
                                    <small>文件浏览、预览与备份服务地址</small>
                                </span>
                                <span class="setting-value">查看<span class="material-icons" style="font-size:18px;">chevron_right</span></span>
                            </button>
                        </div>
                    </section>
                </div>
            </div>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const from = params.get("from");
        const backLink = document.getElementById("backLink");
        const languageRow = document.getElementById("languageRow");
        const languagePanel = document.getElementById("languagePanel");
        const languageValue = document.getElementById("languageValue");
        const toast = document.getElementById("toast");
        let toastTimer = null;

        if (from === "login") {
            backLink.href = "login.html";
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("active");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("active"), 1600);
        }

        languageRow.addEventListener("click", () => {
            languagePanel.classList.toggle("active");
        });

        document.addEventListener("click", (event) => {
            const option = event.target.closest("[data-language]");
            if (option) {
                document.querySelectorAll(".language-option").forEach((item) => item.classList.remove("active"));
                option.classList.add("active");
                languageValue.textContent = option.dataset.language;
                showToast(`语言：${option.dataset.language}`);
                return;
            }

            const toastButton = event.target.closest("[data-toast]");
            if (toastButton) {
                showToast(toastButton.dataset.toast);
            }
        });
    </script>
</body>
</html>
