<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Docker 管理</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'PingFang SC','Helvetica Neue',Arial,sans-serif;}body{display:flex;background-color:#f5f7fa;color:#333;min-height:100vh;}.container{display:flex;width:100%;max-width:1200px;margin:0 auto;padding:20px;}.server-container{width:375px;height:667px;background:linear-gradient(135deg,#6e8efb,#a777e3);border-radius:30px;box-shadow:0 15px 30px rgba(0,0,0,0.1);overflow:hidden;position:relative;margin-right:40px;flex-shrink:0;}.server-header{text-align:center;padding:30px 0 20px;position:relative;}.server-header h1{color:white;font-size:24px;font-weight:600;margin-bottom:5px;}.server-header p{color:rgba(255,255,255,0.8);font-size:14px;}.server-content{background-color:white;border-radius:25px 25px 0 0;padding: 30px 30px 80px;height:calc(100% - 170px);overflow-y: auto;animation:fadeIn 0.6s ease-out;position:relative;}.docker-main{margin-bottom:25px;animation:fadeIn 0.6s ease-out;animation-fill-mode:both;display:flex;flex-direction:column;align-items:flex-start;}.docker-title{font-size:22px;color:#333;margin-bottom:10px;font-weight:600;}.docker-desc{font-size:16px;color:#666;margin-bottom:20px;}.docker-list{width:100%;}.docker-item{background:#f5f7fa;border-radius:10px;padding:15px;margin-bottom:10px;box-shadow:0 2px 8px rgba(110,142,251,0.05);display:flex;align-items:center;}.docker-item .material-icons{color:#6e8efb;margin-right:10px;}.docker-item-title{font-size:16px;font-weight:500;color:#333;}.docker-item-status{margin-left:auto;font-size:14px;color:#8a94a6;}.nav-bar{position:absolute;bottom:0;left:0;right:0;height:50px;background-color:white;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #f0f2f5;z-index: 10;}.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a94a6;font-size:12px;cursor:pointer;transition:all 0.3s;padding:5px 0;width:25%;}.nav-item .material-icons{font-size:20px;margin-bottom:2px;}.nav-item.active{color:#6e8efb;}.nav-item:hover{color:#6e8efb;}@media (max-width:900px){.container{flex-direction:column;align-items:center;}.server-container{margin-right:0;margin-bottom:30px;}}@font-face{font-family:'Material Icons';font-style:normal;font-weight:400;src:url(https://fonts.gstatic.com/s/materialicons/v139/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2) format('woff2');}.material-icons{font-family:'Material Icons';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;}@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}</style></head><body><div class="container"><div class="server-container"><div class="server-content"><div class="docker-main"><div class="docker-title">容器列表</div><div class="docker-desc">在此查看和管理所有运行中的 Docker 容器。</div><div class="docker-list"><div class="docker-item"><span class="material-icons">layers</span><span class="docker-item-title">MediaServer</span><span class="docker-item-status">运行中</span></div><div class="docker-item"><span class="material-icons">layers</span><span class="docker-item-title">FileSync</span><span class="docker-item-status">已停止</span></div></div></div><div class="nav-bar"><div class="nav-item" onclick="location.href='server_info.html'"><span class="material-icons">home</span><span>主页</span></div><div class="nav-item active" onclick="location.href='docker.html'"><span class="material-icons">apps</span><span>docker</span></div><div class="nav-item" onclick="location.href='vm.html'"><span class="material-icons">computer</span><span>虚拟机</span></div><div class="nav-item" onclick="location.href='share.html'"><span class="material-icons">folder_shared</span><span>共享</span></div></div></div></div></div></body></html>
